name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build Mod
        shell: bash
        run: |
          echo "=== NDK HOME ==="
          echo "$ANDROID_NDK_HOME"
          echo "=== NDK BUILD SCRIPT ==="
          cat "$ANDROID_NDK_HOME/ndk-build"
          echo "=== INTERNAL NDK BUILD ==="
          ls -l "$ANDROID_NDK_HOME/build/ndk-build"
          file "$ANDROID_NDK_HOME/build/ndk-build"
          echo "=== START BUILD ==="
          echo "$ANDROID_NDK_HOME" > NDKPath.txt
          chmod +x build.sh
          bash -x ./build.sh

      - name: Prepare Binary
        run: |
          cp libs/arm64-v8a/libHDReflection.so ./HDReflection-arm64-v8a.so


      - name: Build Mod
        shell: bash
        run: |
          echo "=== NDK INTERNAL SCRIPT ==="
          sed -n '1,160p' "$ANDROID_NDK_HOME/build/ndk-build"

          echo "=== MAKE VERSION ==="
          make --version

          echo "=== NDK ENVIRONMENT ==="
          env | sort | grep -E '^(ANDROID|NDK|MAKE|GNUMAKE)' || true

          echo "=== TRACE NDK BUILD ==="
          bash -x "$ANDROID_NDK_HOME/build/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk NDK_DEBUG=0
      - name: Upload Build Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: HDReflection-ARM64
