name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

- name: Build Mod
        shell: bash
        run: |
          NDK="$ANDROID_NDK_HOME"
          echo "NDK: $NDK"
          test -f "$NDK/ndk-build" || { echo "ndk-build tidak ditemukan"; exit 1; }
          bash "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            NDK_DEBUG=0
            
      - name: Prepare Binary
        run: |
          cp libs/arm64-v8a/libHDReflection.so ./HDReflection-arm64-v8a.so

      - name: Upload Build Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: HDReflection-ARM64
          path: HDReflection-arm64-v8a.so

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HDReflection-arm64-v8a.so
          generate_release_notes: true
